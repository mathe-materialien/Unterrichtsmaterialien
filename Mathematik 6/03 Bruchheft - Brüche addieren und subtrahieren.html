<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bruchheft – Brüche plus und minus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fdfcf7; --desk:#e9eef3; --karo:#cfdcec; --text:#25303f; --muted:#5b6677; --ink:#1c3fa0;
  --red:#cf2f2a; --green:#1d8248; --hl:#fff09a; --focus:#e6eeff; --vb:#bcd6f2;
  --gl:#e0592a; --ug:#2f7fc4; --gz:#8352bf; --mix:#1f8a6e; --rev:#a8791a; --tab:var(--gl);
  --hand:"Patrick Hand","Comic Sans MS","Segoe Print",cursive;
  --ui:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1c2232; --desk:#121620; --karo:#2e3a55; --text:#e7ebf3; --muted:#a4aec3; --ink:#93b6ff;
    --red:#ff6b64; --green:#55d492; --hl:#5a5120; --focus:#26335a; --vb:#2c4a70;
    --gl:#ff7a4d; --ug:#5aa9ec; --gz:#ab85e8; --mix:#3cc79f; --rev:#e0ae45;
  }
}
:root[data-theme="dark"]{
  --paper:#1c2232; --desk:#121620; --karo:#2e3a55; --text:#e7ebf3; --muted:#a4aec3; --ink:#93b6ff;
  --red:#ff6b64; --green:#55d492; --hl:#5a5120; --focus:#26335a; --vb:#2c4a70;
  --gl:#ff7a4d; --ug:#5aa9ec; --gz:#ab85e8; --mix:#3cc79f; --rev:#e0ae45;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--desk);color:var(--text);font-family:var(--ui);font-size:16px;line-height:1.5}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tab);outline-offset:2px}
.hidden{display:none!important}
main{max-width:820px;margin:0 auto;padding:18px 14px 48px}

/* Heft-Umschlag */
.cover{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.label{background:var(--paper);border:2px solid var(--text);border-radius:6px;padding:8px 18px 6px;transform:rotate(-1.2deg);box-shadow:3px 3px 0 var(--text)}
.label h1{font-family:var(--hand);font-weight:400;font-size:44px;line-height:1;margin:0;color:var(--ink)}
.label p{margin:0;font-size:13px;color:var(--muted)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.coverright{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.levels{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:700}
.levels button{border:2px solid var(--text);background:var(--paper);border-radius:999px;min-width:34px;padding:2px 10px;font-weight:700;box-shadow:2px 2px 0 var(--text)}
.levels button[aria-pressed="true"]{background:var(--tab);border-color:var(--tab);color:#fff}
.togs{display:inline-flex;gap:4px;flex-wrap:wrap;max-width:230px}
.tog{font-size:12px;line-height:1.3;border:2px dashed var(--karo);border-radius:999px;background:var(--paper);padding:3px 9px;color:var(--muted);text-align:left}
.tog[aria-pressed="true"]{border:2px solid var(--ink);color:var(--ink);font-weight:700}
.line.togon .frac,.line.togon .mixin,.line.togon>.fin,.line.togon>.opx{opacity:.3}
.line.errline{box-shadow:0 0 0 2px var(--red)}
.togrow{display:flex;max-width:min(560px,calc(100vw - 110px));margin:-4px 0 6px 2.4em}
.stat{background:var(--paper);border-radius:999px;padding:4px 12px;font-size:13px;border:1px solid var(--karo)}
.stat b{font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stat .s{font-family:var(--hand);font-size:18px;line-height:0}

/* Register-Reiter */
.tabs{display:flex;gap:6px;margin:22px 0 0 10px;position:relative;z-index:1;flex-wrap:wrap;align-items:flex-end}
.tab{border:none;border-radius:12px 12px 0 0;padding:10px 13px 12px;font-weight:700;font-size:15px;white-space:nowrap;color:#fff;opacity:.55;transform:translateY(6px);transition:transform .15s,opacity .15s}
.tab[data-kind="gl"]{background:var(--gl)} .tab[data-kind="ug"]{background:var(--ug)} .tab[data-kind="gz"]{background:var(--gz)} .tab[data-kind="mix"]{background:var(--mix)} .tab[data-kind="rev"]{background:var(--rev)}
.tab[aria-selected="true"]{opacity:1;transform:none}
.tab .sym{font-family:var(--hand);font-size:26px;line-height:0;margin:0 3px;vertical-align:-2px}
.tab .badge{display:inline-block;min-width:22px;padding:0 6px;margin-left:6px;border-radius:999px;background:rgba(255,255,255,.3);font-size:13px;text-align:center}
.tab .sm{display:none}
.fi{display:inline-flex;flex-direction:column;align-items:center;gap:2px;vertical-align:middle;margin:0 1px}
.fi i{display:block;width:.62em;height:.62em;border:2px solid currentColor;border-radius:2px}
.fi b{display:block;width:.95em;height:2px;background:currentColor;border-radius:1px}
.ni{display:inline-block;width:.72em;height:.95em;border:2px solid currentColor;border-radius:2px;vertical-align:middle;margin:0 1px}
.ico{display:inline-flex;align-items:center;gap:5px;vertical-align:middle}
.ico .o{font-family:var(--hand);font-size:1.6em;line-height:0}
.stat .ico{font-size:12px;gap:3px;margin-right:4px}

/* Heftseite */
.sheet{position:relative;background:var(--paper);border-radius:4px 14px 14px 14px;border-top:6px solid var(--tab);padding:18px 16px 20px;box-shadow:0 2px 0 var(--karo),0 10px 30px rgba(20,30,50,.08);
  background-image:linear-gradient(var(--karo) 1px,transparent 1px),linear-gradient(90deg,var(--karo) 1px,transparent 1px);background-size:22px 22px;background-position:-1px -1px}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:44px;width:2px;background:color-mix(in srgb,var(--red) 45%,transparent);pointer-events:none}
.inner{position:relative;padding-left:40px}
.revinfo{font-size:14px;color:var(--muted);background:var(--paper);padding:2px 8px;border-radius:6px;width:fit-content;margin-bottom:6px}
.phases{list-style:none;display:flex;gap:6px;padding:0;margin:0 0 4px;flex-wrap:wrap}
.phases li{background:var(--paper);border:1.5px solid var(--karo);border-radius:999px;padding:3px 12px;font-size:13px;color:var(--muted)}
.phases li.now{border-color:var(--tab);color:var(--text);font-weight:700;box-shadow:inset 0 0 0 1px var(--tab)}
.phases li.done{color:var(--green);border-color:var(--green)}

/* Rechnung untereinander */
.linewrap{position:relative;overflow-x:auto;margin:12px 0 8px;padding:6px 2px 10px}
.lines{display:flex;flex-direction:column;gap:8px;width:max-content;min-width:100%}
.line{display:flex;align-items:center;gap:10px;background:var(--paper);padding:6px 12px;border-radius:10px;width:fit-content;transition:opacity .2s}
.line.task{padding-top:8px;padding-bottom:8px}
.line.task .small{font-size:14px;color:var(--muted);margin-right:4px;font-family:var(--ui)}
.line.wait{opacity:.45}
.line.hl{background:var(--hl)}
.line.skipped .frac,.line.skipped .fin,.line.skipped .opx{opacity:.35}
.line.claimed>:not(.eqs):not(.claim):not(.tagx){display:none}
.line.claimed{min-height:60px}
.den{display:inline-flex;align-items:center;gap:4px}
.den .dot{font-size:24px}
.hnlab{font-size:14px;color:var(--muted);font-family:var(--ui);margin-right:4px}
.line.hn .eqs{display:none}
.claim{font-size:14px;white-space:normal!important;font-weight:700;color:var(--green);border:2px solid var(--green);border-radius:999px;padding:2px 10px;transform:rotate(-2deg);white-space:nowrap;background:var(--paper)}
.sol .claim{color:var(--ink);border-color:var(--ink)}
.eqs,.opx{font-family:var(--hand);font-size:29px;line-height:1;min-width:.6em;text-align:center}
.frac{display:inline-flex;flex-direction:column;align-items:center;gap:3px}
.frac .bar{align-self:stretch;height:3px;background:var(--text);border-radius:2px;min-width:1.4em}
.sn{font-family:var(--hand);font-size:24px;line-height:1.15;min-width:1em;text-align:center;padding:0 .15em}
.sw{font-family:var(--hand);font-size:35px;line-height:1;padding-right:.08em}
.mixin{display:inline-flex;align-items:center;gap:6px}
.fin{--len:2;width:calc(var(--len) * .58em + .8em);height:1.5em;font-family:var(--hand);font-size:24px;line-height:1;text-align:center;color:var(--ink);-webkit-text-fill-color:var(--ink);background:color-mix(in srgb,var(--paper) 88%,transparent);border:2px solid var(--karo);border-radius:8px;padding:0;caret-color:var(--ink);appearance:none;-moz-appearance:textfield}
.fin.w{font-size:32px}
.fin:focus{outline:none;border-color:var(--ink);background:var(--focus)}
.fin:disabled{opacity:1;cursor:default}
.line.wait .fin{background:color-mix(in srgb,var(--karo) 30%,transparent)}
.fin.ok{border-color:var(--green);color:var(--green);-webkit-text-fill-color:var(--green)}
.fin.bad{border-color:var(--red);color:var(--red);-webkit-text-fill-color:var(--red);background:color-mix(in srgb,var(--red) 11%,transparent);box-shadow:0 0 0 1px var(--red)}
.line.done .fin.ok{border-color:color-mix(in srgb,var(--green) 40%,transparent)}
.tagx{font-size:12px;color:var(--muted);border:1.5px solid var(--karo);border-radius:999px;padding:1px 9px;margin-left:6px;white-space:nowrap;background:var(--paper)}
.line.now .tagx{border-color:var(--tab);color:var(--text)}
.sol .sn{color:var(--ink)} .sol .sw{color:var(--ink)}
.sol .line.task .sn,.sol .line.task .sw,.sol .given .sn,.sol .given .sw,.sol .sn.given{color:var(--text)}
.new{animation:ink .45s ease}
@keyframes ink{from{transform:scale(1.3);opacity:0}to{transform:none;opacity:1}}

.stamp{position:absolute;right:5%;top:28%;transform:rotate(-14deg);border:4px double var(--red);color:var(--red);font-family:var(--hand);font-size:40px;padding:0 16px;border-radius:10px;background:color-mix(in srgb,var(--paper) 80%,transparent);pointer-events:none;animation:stamp .4s cubic-bezier(.2,1.8,.4,1)}
@keyframes stamp{from{transform:rotate(-14deg) scale(2.2);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:1}}

/* Brüche im Text */
.ifr{display:inline-flex;flex-direction:column;vertical-align:middle;font-family:var(--hand);font-size:1.2em;line-height:1;text-align:center;margin:0 .1em}
.ifr>span{padding:0 .18em}
.ifr>span:first-child{border-bottom:2px solid currentColor;padding-bottom:1px}

/* Rückmeldung */
.note{background:var(--paper);border:2px solid var(--karo);border-radius:12px;padding:12px 14px;margin:8px 0 14px;max-width:62ch}
.note p{margin:0}
.note ul{margin:6px 0 0;padding-left:20px}
.note li{margin:5px 0}
.note.good{border-color:var(--green)}
.note.good>p>strong:first-child{color:var(--green)}
.note.bad{border-color:var(--red)}
.note.bad>p>strong:first-child{color:var(--red)}
.note strong{font-weight:700}

.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stepbox{width:min(62ch,calc(100vw - 96px));margin:2px 0 8px;scroll-margin-bottom:16px}
.stepbox .note{margin:0 0 10px;max-width:none}
.lineact{display:inline-flex;gap:6px;align-items:center;margin-left:auto;padding-left:10px}
.line.hasok{align-self:stretch;width:auto}
.lineact .btn{padding:5px 12px;font-size:14px;box-shadow:2px 2px 0 var(--text)}
.lineact .btn.main{min-width:54px}
.lineact.below{display:flex;flex-wrap:wrap;justify-content:flex-end;margin:-2px 0 6px;padding-left:0;width:0;min-width:100%}
.actions.more{margin-top:14px;padding-top:12px;border-top:2px dashed var(--karo)}
.btn{border:2px solid var(--text);background:var(--paper);border-radius:10px;padding:9px 14px;font-weight:500;font-size:15px;box-shadow:2px 2px 0 var(--text);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--text)}
.btn.main{background:var(--tab);border-color:var(--tab);color:#fff;font-weight:700;box-shadow:2px 2px 0 var(--text)}
.btn:disabled{opacity:.4;cursor:default}

/* Musterlösung */
.solution{margin-top:18px}
.solution h2{font-family:var(--hand);font-weight:400;font-size:32px;margin:0;color:var(--ink);background:var(--paper);width:fit-content;padding:0 8px;border-radius:6px}
.soltext{background:var(--paper);border-left:4px solid var(--tab);padding:10px 14px;border-radius:0 10px 10px 0;min-height:64px;max-width:62ch;font-size:16px;line-height:1.75}
.vis{background:var(--paper);border-radius:10px;padding:8px;margin-top:8px;max-width:520px}
.vis svg{display:block;width:100%;height:auto}
.vis .vf{fill:var(--tab)} .vis .vf2{fill:color-mix(in srgb,var(--tab) 50%,var(--paper))} .vis .ve{fill:var(--paper)}
.vis .va{fill:var(--hl)} .vis .vb{fill:var(--vb)}
.vis rect{stroke:var(--text);stroke-width:.8}
.vis .vu{fill:none;stroke-width:2.5}
.vis .vl{font-family:var(--hand);font-size:27px;fill:var(--text)} .vis .vs{font-size:24px}
.solnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.solnav .count{font-size:14px;color:var(--muted);background:var(--paper);padding:2px 8px;border-radius:6px}

/* Eigene Aufgabe */
.overlay{position:fixed;inset:0;background:rgba(15,20,35,.5);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--paper);border:2px solid var(--text);border-radius:14px;box-shadow:5px 5px 0 var(--text);padding:20px;max-width:460px;width:100%;max-height:100%;overflow:auto}
.modal h2{font-family:var(--hand);font-weight:400;font-size:32px;margin:0 0 4px;color:var(--ink)}
.modal .hint{margin:0 0 12px;font-size:14px;color:var(--muted)}
.ownrow{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.ownnum{display:flex;align-items:center;gap:6px}
.ownnum input{font-family:var(--hand);text-align:center;border:2px solid var(--karo);border-radius:8px;background:var(--paper);color:var(--ink);padding:0}
.ownnum input:focus{outline:none;border-color:var(--ink);background:var(--focus)}
.ownnum .g{width:2.1em;height:1.5em;font-size:34px}
.ownnum .z,.ownnum .n{width:2.6em;height:1.45em;font-size:24px}
.opsel{display:flex;flex-direction:column;gap:6px}
.opsel button{width:46px;height:40px;border:2px solid var(--text);border-radius:10px;background:var(--paper);font-family:var(--hand);font-size:30px;line-height:1}
.opsel button[aria-pressed="true"]{background:var(--tab);border-color:var(--tab);color:#fff}
.modal .err{color:var(--red);min-height:22px;font-size:14px;margin:10px 0 4px}
.modal .actions{justify-content:flex-end;margin-top:8px}

.brand{display:flex;align-items:flex-start;gap:12px}
.cover .coverright{margin-left:auto;flex:1 1 280px}
.cover .stats{justify-content:flex-end}
.qrbtn{flex:none;width:30px;height:30px;display:grid;place-items:center;border:2px solid var(--text);border-radius:7px;background:var(--paper);color:var(--text);box-shadow:2px 2px 0 var(--text);padding:0;transition:transform .06s,box-shadow .06s}
.qrbtn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--text)}
.modal.qrmodal{max-width:none;width:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.modal.qrmodal h2{margin:0}
.qrbox{background:#ffffff;padding:12px;border-radius:10px;border:2px solid var(--karo);line-height:0}
.qrbox svg{display:block;width:min(calc(100vw - 100px),calc(100vh - 250px),460px);height:auto;min-width:160px}
.qrurl{font-size:13px;color:var(--muted);margin:0;max-width:min(calc(100vw - 100px),calc(100vh - 250px),460px);overflow-wrap:anywhere;user-select:all}
.modal.qrmodal .actions{margin:0}
@media (max-width:560px){
  .inner{padding-left:24px}
  .sheet{padding-left:10px;padding-right:10px}
  .sheet::before{left:26px}
  .label h1{font-size:36px}
  .fin{font-size:21px} .fin.w{font-size:27px}
  .eqs,.opx{font-size:24px} .sn{font-size:21px} .sw{font-size:30px}
  .line{gap:7px;padding:5px 8px}
  .tagx{display:none}
}
@media (max-width:700px){
  .tabs{margin-left:4px;gap:4px}
  .tab{padding:8px 9px 10px;font-size:14px}
  .tab .sym{font-size:22px;margin:0 3px 0 0}
  .tab .badge{margin-left:4px;min-width:18px;padding:0 4px}
  .tab .lg{display:none} .tab .sm{display:inline}
}
@media (max-width:440px){.tab{padding:7px 6px 9px;font-size:12.5px}.tabs{gap:2px;margin-left:0}.den .fin{font-size:18px}.den .opx{font-size:19px}.line{gap:5px}.hnlab{font-size:12px}}
@media (max-width:370px){.tab{padding:6px 5px 8px;font-size:12px}.tabs{gap:2px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header class="cover">
    <div class="brand">
    <button class="qrbtn" id="qrBtn" type="button" title="QR-Code zu dieser Seite zeigen" aria-label="QR-Code zu dieser Seite zeigen">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor"><path d="M3 3h8v8H3zm2 2v4h4V5zm8-2h8v8h-8zm2 2v4h4V5zM3 13h8v8H3zm2 2v4h4v-4zm8-2h2v2h-2zm2 2h2v2h-2zm2-2h2v2h-2zm2 2h2v2h-2zm-6 2h2v2h-2zm4 0h2v2h-2zm-2 2h2v2h-2zm4 0h2v2h-2z"/></svg>
    </button>
    <div class="label"><h1>Bruchheft</h1><p>Brüche addieren und subtrahieren</p></div>
    </div>
    <div class="coverright">
      <div class="levels hidden" id="levels" role="group" aria-label="Level">
        <span>Level</span>
        <button type="button" data-level="1" title="Zahlen bis 60, mit Hilfen">1</button>
        <button type="button" data-level="2" title="Zahlen bis 100, ohne Hilfen">2</button>
        <button type="button" data-level="3" title="Zahlen bis 100, nur am Ende prüfen">3</button>
      </div>
      <div class="stats" id="stats"></div>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Aufgabenart">
    <button class="tab" role="tab" data-kind="gl" title="Gleichnamige Brüche"><span class="lg">Gleichnamig</span><span class="sm">Gleich</span></button>
    <button class="tab" role="tab" data-kind="ug" title="Ungleichnamige Brüche"><span class="lg">Ungleichnamig</span><span class="sm">Ungleich</span></button>
    <button class="tab" role="tab" data-kind="gz" title="Gemischte Zahlen"><span class="lg">Gemischte Zahlen</span><span class="sm">Gem. Z.</span></button>
    <button class="tab" role="tab" data-kind="mix" title="Alles" aria-label="Alles">🎲 Alles</button>
    <button class="tab" role="tab" data-kind="rev" title="Fehler-Training" aria-label="Fehler-Training">🔁<span class="lg"> Fehler-Training</span><span class="badge" id="revBadge">0</span></button>
  </nav>

  <section class="sheet">
    <div class="inner">
      <div class="revinfo hidden" id="revInfo"></div>
      <ol class="phases" id="phases"></ol>
      <div class="linewrap" id="work"><div class="lines" id="lines"></div><div class="stamp hidden" id="stamp"></div></div>
      <div class="stepbox" id="stepbox">
        <div class="note" id="note" aria-live="polite"></div>
        <div class="actions">
          <button class="btn main" id="checkBtn">✓ Prüfen</button>
          <button class="btn hidden" id="noBtn">🚫 Kann nicht gekürzt werden</button>
          <button class="btn hidden" id="skipBtn">⏭ Überspringen</button>
          <button class="btn main hidden" id="nextBtn">Neue Aufgabe ▶</button>
        </div>
      </div>
      <div class="actions more">
        <button class="btn" id="solBtn">👀 Musterlösung</button>
        <button class="btn" id="resetBtn">↺ Nochmal von vorn</button>
        <button class="btn" id="newBtn">Neue Aufgabe</button>
        <button class="btn" id="ownBtn">✏️ Eigene Aufgabe</button>
      </div>

      <div class="solution hidden" id="solution">
        <h2>Musterlösung</h2>
        <div class="linewrap sol"><div class="lines" id="solLines"></div></div>
        <div class="soltext" id="solText" aria-live="polite"></div>
        <div class="vis hidden" id="solVis"></div>
        <div class="solnav">
          <button class="btn" id="solPrev">◀ Zurück</button>
          <button class="btn main" id="solNext">Weiter ▶</button>
          <span class="count" id="solCount"></span>
          <button class="btn" id="solClose">Selbst nochmal probieren</button>
        </div>
      </div>
    </div>

/* Zufallsaufgaben (Zahlenraum bis 100, keine negativen Ergebnisse) */

  for(let i=0;i<500;i++){const n=rnd(3,SIZE()),op=pick(["add","sub"]);let a=propRed(n),b=propRed(n);

  for(;;){const s=SIZE(),m=rnd(2,Math.min(s,50)),n=Math.random()<.35?m*rnd(2,5):rnd(2,s);

/* ---------- Eigene Aufgabe ---------- */
function parseOwn(a,op,b){

    if([g,z,n].some(s=>s&&!/^\d+$/.test(s)))return{err:"Bitte nur Ziffern eingeben."};

    if(N!==null&&N>100)return{err:"Nimm Nenner bis 100."};
    if(Z===null){if(G===0)return{err:"Die "+nm+" Zahl darf nicht 0 sein."};return{o:{w:G,z:0,n:1}}}
    if(G>0&&Z>=N)return{err:"Bei einer gemischten Zahl muss der Bruch kleiner als 1 sein."};
    return{o:{w:G,z:Z,n:N}};

  const t={op,A:A.o,B:B.o};
  if(hasF(t.A)&&hasF(t.B)&&lcm(t.A.n,t.B.n)>1000)return{err:"Der gemeinsame Nenner wäre zu groß. Nimm andere Nenner."};

  if(result(t)[0]>100*result(t)[1]+100)return{err:"Das Ergebnis ist zu groß. Bleib im Zahlenraum bis 100."};

}

/* ---------- Prüfen ---------- */

function checkE(t,ctx,v){

}
function checkR(t,ctx,v){
  const o=out(),B=ctx.B,M=[B.z,B.n],T=red(M),mixed=kindOf(t)==="gz",x=v.z,y=v.n;
  const wOk=()=>{if(!mixed)return true;const w=z0(v.w,B.w);if(w===B.w){mk(o,"ok","R.w");return true}mk(o,"bad","R.w");o.msgs.push(S("Ganze")+": Die bleiben beim Kürzen gleich.");return false};
  const done=(f,extra)=>{o.ctx=Object.assign(cp(ctx),{R:{w:B.w,z:f[0],n:f[1]}},extra||{});return o};
  if(x==null){mk(o,"bad","R.z");if(y==null)mk(o,"bad","R.n");wOk();o.msgs.push("Schreib den gekürzten Bruch hin. Lässt sich nichts kürzen, tippe auf „Kann nicht gekürzt werden“.");return o}
  if(y==null){
    if(!mixed&&T[1]===1&&x===T[0]){mk(o,"ok","R.z");o.info="Das Ergebnis ist sogar eine ganze Zahl.";return done([x,1],{Rint:true})}
    mk(o,"bad","R.n");wOk();o.msgs.push(S("Nenner")+" fehlt noch.");return o;
  }
  if(y===0){mk(o,"bad","R.n");o.msgs.push("Im Nenner darf keine 0 stehen.");return o}
  const wg=wOk();
  if(eq([x,y],M)){
    if(x>M[0]){mk(o,"bad","R.z","R.n");o.msgs.push("Der Wert stimmt, aber du hast erweitert statt gekürzt. Beim Kürzen werden Zähler und Nenner kleiner.");return o}
    if(gcd(x,y)===1){mk(o,"ok","R.z","R.n");if(!wg)return o;
      if(y===1)o.info="Im Nenner steht 1. Im nächsten Schritt machst du daraus eine ganze Zahl.";else if(x===M[0])o.info="Genau, dieser Bruch lässt sich nicht kürzen.";
      return done([x,y])}
    mk(o,"bad","R.z","R.n");o.msgs.push("Der Wert stimmt, aber du kannst noch weiter kürzen: "+x+" und "+y+" haben noch einen gemeinsamen Teiler.");return o;
  }
  if(y===M[1]&&x!==M[0]&&M[0]%x===0){mk(o,"bad","R.z");mk(o,"ok","R.n");o.msgs.push("Du hast nur den Zähler geteilt. Beim Kürzen teilst du Zähler "+S("und")+" Nenner durch dieselbe Zahl.");return o}
  if(x===M[0]&&y!==M[1]&&M[1]%y===0){mk(o,"ok","R.z");mk(o,"bad","R.n");o.msgs.push("Du hast nur den Nenner geteilt. Beim Kürzen teilst du Zähler "+S("und")+" Nenner durch dieselbe Zahl.");return o}
  mk(o,x===T[0]?"ok":"bad","R.z");mk(o,y===T[1]?"ok":"bad","R.n");if(o.marks["R.z"]==="ok"&&o.marks["R.n"]==="ok")mk(o,"bad","R.z","R.n");
  if(M[0]%x===0&&M[1]%y===0&&x<=M[0]&&y<=M[1])o.msgs.push("Du hast den Zähler durch "+(M[0]/x)+" und den Nenner durch "+(M[1]/y)+" geteilt. Beim Kürzen musst du beide durch "+S("dieselbe")+" Zahl teilen.");
  else o.msgs.push("Beim Kürzen hat sich der Wert des Bruchs verändert. Teile Zähler und Nenner durch dieselbe Zahl.");
  return o;
}
function checkG(t,ctx,v){
  const o=out(),R=ctx.R,p=R.z,q=R.n,W=R.w,mixed=kindOf(t)==="gz",w=v.w,x=v.z,y=v.n;
  const improper=mixed?p>=q:(p>q||q===1);
  if(w==null&&x==null&&y==null){o.ok=false;o.noPenalty=true;o.msgs.push(q===1?"Im Nenner steht 1. Schreib das Ergebnis als ganze Zahl ins große Feld.":"Schreib die ganze oder gemischte Zahl hin oder tippe auf einen der Knöpfe darunter.");return o}
  if(!improper){[["G.w",w],["G.z",x],["G.n",y]].forEach(([id,val])=>{if(val!=null)mk(o,"bad",id)});
    o.msgs.push(mixed?"Der Bruchteil ist schon kleiner als 1. Hier gibt es nichts umzuwandeln.":"Dein Ergebnis ist kleiner als 1. Daraus kann man keine gemischte Zahl machen.");return o}
  const W2=W+Math.floor(p/q),r=p%q;
  if(r===0){
    if(w===W2&&x==null&&y==null){mk(o,"ok","G.w");return o}
    if(w===W2){mk(o,"ok","G.w");if(x!=null)mk(o,"bad","G.z");if(y!=null)mk(o,"bad","G.n");o.msgs.push("Die ganze Zahl stimmt. Einen Bruchteil gibt es hier nicht, lass die kleinen Felder leer.");return o}
    mk(o,"bad","G.w");if(x!=null)mk(o,"bad","G.z");if(y!=null)mk(o,"bad","G.n");
    o.msgs.push(mixed&&w===W?S("Ganze")+": Der Bruchteil ist genau ein Ganzes"+(p/q>1?" oder mehr":"")+". Das kommt zu den Ganzen dazu.":q===1?"Im Nenner steht 1. Ein Bruch mit dem Nenner 1 ist eine ganze Zahl. Welche?":"Das stimmt noch nicht. Wie viele Ganze sind es insgesamt?");
    return o}
  if(w==null){mk(o,"bad","G.w");o.msgs.push(S("Ganze Zahl")+" fehlt noch.")}
  if(x==null||y==null){if(x==null)mk(o,"bad","G.z");if(y==null)mk(o,"bad","G.n");o.msgs.push(S("Bruchteil")+": Da fehlt noch etwas.")}
  if(!o.ok){if(w!=null)mk(o,w===W2?"ok":"bad","G.w");if(x!=null)mk(o,x===r?"ok":"bad","G.z");if(y!=null)mk(o,y===q?"ok":"bad","G.n");return o}
  if(y===0){mk(o,"bad","G.n");o.msgs.push("Im Nenner darf keine 0 stehen.");return o}
  if(w===W2&&x===r&&y===q){mk(o,"ok","G.w","G.z","G.n");return o}
  if((w*y+x)*q===(W*q+p)*y){
    if(x>=y){mk(o,"bad","G.w","G.z");mk(o,"ok","G.n");o.msgs.push("Der Wert stimmt, aber im Bruchteil steckt noch mindestens ein Ganzes.");return o}
    mk(o,"ok","G.w");mk(o,"bad","G.z","G.n");o.msgs.push("Der Wert stimmt, aber den Bruchteil kannst du noch kürzen.");return o}
  if(w!==W2){mk(o,"bad","G.w");
    if(mixed&&w===W)o.msgs.push(S("Ganze")+": Im Bruchteil steckt ein Ganzes. Das kommt zu den "+W+" Ganzen dazu.");
    else if(mixed&&w===Math.floor(p/q))o.msgs.push(S("Ganze")+": Vergiss die "+W+" Ganzen nicht, die schon da waren.");
    else o.msgs.push(S("Ganze")+": Die stimmen nicht. Überlege: Wie oft passt "+q+" in "+p+"?")}else mk(o,"ok","G.w");
  if(y!==q){mk(o,"bad","G.n");o.msgs.push(S("Nenner")+": Der bleibt gleich.")}else mk(o,"ok","G.n");
  if(x!==r){mk(o,"bad","G.z");o.msgs.push(S("Zähler")+": Er ist der Rest, der übrig bleibt.")}else mk(o,"ok","G.z");
  return o;
}
const CHECK={H:checkH,E:checkE,Z:checkZ,A:checkA,B:checkB,R:checkR,G:checkG};
function check(step,t,ctx,v){const r=CHECK[step](t,ctx,v);if(r.ok&&!r.ctx)r.ctx=cp(ctx);return r}

function claim(step,t,ctx,kind){
  const o=out(),mixed=kindOf(t)==="gz",ok=(c,info,extra)=>{o.ctx=Object.assign(cp(ctx),extra||{});o.claimed=c;o.info=info;return o},no=m=>{o.ok=false;o.msgs.push(m);return o};
  if(kind==="zero")return ok("entfällt, es gibt keinen Bruchteil","");
  if(step==="Z"){const a=ctx.X[0],b=ctx.X[1];
    if(a.z>=b.z)return ok("nicht nötig","Stimmt, der erste Bruchteil ist groß genug. Du kannst direkt abziehen.");
    return no("Doch! Der Bruchteil "+fr(a.z,a.n)+" ist kleiner als "+fr(b.z,b.n)+". So kannst du den zweiten Bruchteil nicht abziehen. Zerlege ein Ganzes.")}
  if(step==="R"){const B=ctx.B;
    if(gcd(B.z,B.n)===1)return ok("kann nicht gekürzt werden",B.n===1?"Stimmt. Im Nenner steht 1, im nächsten Schritt machst du daraus eine ganze Zahl.":"Stimmt, "+fr(B.z,B.n)+" lässt sich nicht kürzen.",{R:{w:B.w,z:B.z,n:B.n}});
    return no("Doch! "+B.z+" und "+B.n+" haben noch einen gemeinsamen Teiler. Probier es noch einmal.")}
  if(step==="G"){const R=ctx.R,p=R.z,q=R.n;
    if(ctx.Rint&&kind==="nomix")return ok("ist schon eine ganze Zahl","Du hast das Ergebnis schon als ganze Zahl geschrieben.");
    if(q===1)return no("Im Nenner steht 1. So darf das Ergebnis nicht stehen bleiben: Ein Bruch mit dem Nenner 1 ist eine ganze Zahl. Schreib sie ins große Feld.");
    const improper=mixed?p>=q:p>q;
    if(kind==="nomix"){if(!improper)return ok("kann nicht umgewandelt werden",mixed?"Stimmt, der Bruchteil ist kleiner als 1.":"Stimmt, der Zähler ist kleiner als der Nenner. Das Ergebnis ist kleiner als 1.");
      return no(mixed?"Doch! Der Bruchteil ist größer als 1. Da steckt noch ein Ganzes drin, das zu den Ganzen dazukommt.":"Doch! Der Zähler ist größer als der Nenner, da steckt mindestens ein Ganzes drin. Du kannst eine gemischte Zahl daraus machen oder den Bruch so stehen lassen.")}
    if(mixed)return no("Bei gemischten Zahlen muss der Bruchteil kleiner als 1 sein.");
    if(improper){o.skipped=true;return ok("bleibt ein unechter Bruch","Du lässt das Ergebnis als unechten Bruch stehen. Das ist auch richtig!")}
    return no("Dein Ergebnis ist gar kein unechter Bruch: Der Zähler ist kleiner als der Nenner.");
  }
  o.ok=false;return o;
}

/* ---------- Veranschaulichung ---------- */
function strips(rows){
  const units=Math.max(1,...rows.map(r=>Math.max(1,Math.ceil(r.f[0]/r.f[1]))));
  const maxN=Math.max(...rows.map(r=>r.f[1]));
  if(units>3||maxN>30||units*maxN>60)return"";
  const LW=112,W=480,uw=(W-LW-10)/units,h=34,gap=16;let s="",y=10;
  rows.forEach(r=>{
    const [z,n]=r.f,u=Math.max(1,Math.ceil(z/n)),pw=uw/n;
    s+='<text x="'+(LW-12)+'" y="'+(y+h/2+9)+'" text-anchor="end" class="vl">'+r.label+'</text>';
    for(let i=0;i<u*n;i++){const on=i<z,sec=r.split!=null&&i>=r.split;
      s+='<rect x="'+(LW+Math.floor(i/n)*uw+(i%n)*pw).toFixed(1)+'" y="'+y+'" width="'+pw.toFixed(1)+'" height="'+h+'" class="'+(on?(sec?"vf2":"vf"):"ve")+'"/>'}
    for(let k=0;k<u;k++)s+='<rect x="'+(LW+k*uw).toFixed(1)+'" y="'+y+'" width="'+uw.toFixed(1)+'" height="'+h+'" class="vu"/>';
    y+=h+gap;
  });
  return'<svg viewBox="0 0 '+W+' '+(y-gap+14)+'" role="img" aria-label="Bruchstreifen">'+s+'</svg>';
}

/* ---------- Musterlösung ---------- */
function solution(t){
  const P=plan(t),c=canonical(t),kind=kindOf(t),add=t.op==="add",steps=[],vals={_no:{}};
  const X0=[t.A,t.B];
  let intro="So rechnest du "+taskH(t)+". ";
  intro+=kind==="gl"?"Die Brüche haben denselben Nenner, sie sind "+S("gleichnamig")+". Du "+(add?"addierst":"subtrahierst")+" nur die Zähler, der Nenner bleibt. ":kind==="ug"?"Die Brüche haben verschiedene Nenner. Du machst sie zuerst "+S("gleichnamig")+", dann "+(add?"addierst":"subtrahierst")+" du die Zähler. ":"Bei gemischten Zahlen rechnest du die "+S("Ganzen")+" und die "+S("Bruchteile")+" getrennt. ";
  intro+="Wir schreiben alles untereinander, so wie im Heft.";
  steps.push({text:intro,vals:cp(vals),hl:null,vis:""});
  P.forEach(k=>{
    let text="",vis="";const H=c.A.n;
    if(k in c)vals[k]=c[k];if(c._no[k])vals._no[k]=true;
    if(k==="H"){const m=t.A.n,n=t.B.n;
      text="Die Nenner "+m+" und "+n+" sind verschieden. Du suchst den "+S("Hauptnenner")+": die kleinste Zahl, die durch "+m+" und durch "+n+" teilbar ist. "+(H===Math.max(m,n)?H+" ist selbst schon durch "+Math.min(m,n)+" teilbar, also ist "+H+" der Hauptnenner.":"Geh die Vielfachen von "+Math.max(m,n)+" durch: "+Array.from({length:H/Math.max(m,n)},(_,i)=>(i+1)*Math.max(m,n)).join(", ")+". Die erste Zahl, die auch durch "+Math.min(m,n)+" teilbar ist, ist "+H+".");
    }
    if(k==="E"){
      const parts=[0,1].filter(i=>X0[i].z).map(i=>{const o=X0[i],f=H/o.n;return f===1?fr(o.z,o.n)+" hat schon den Nenner "+H+".":fr(o.z,o.n)+": "+o.n+" · "+f+" = "+H+", also erweiterst du mit "+f+": "+fr(o.z+" · "+f,o.n+" · "+f)+" = "+fr(o.z*f,H)+"."});
      text="Jetzt "+S("erweiterst")+" du beide Brüche auf den Nenner "+H+". Dabei nimmst du Zähler und Nenner mit derselben Zahl mal. "+parts.join(" ")+(kind==="gz"?" Die Ganzen bleiben, wie sie sind.":"");
      const o=X0.find(o=>o.z&&H/o.n>1);if(o&&!X0.some(x=>x.w))vis=strips([{f:[o.z,o.n],label:o.z+"/"+o.n},{f:[o.z*H/o.n,H],label:(o.z*H/o.n)+"/"+H}]);
      if(vis)text+=" Im Bild siehst du: Der Wert bleibt beim Erweitern gleich, die Teile werden nur kleiner.";
    }
    if(k==="Z"){
      const a=c.E?{w:t.A.w,z:c.E.A[0]}:{w:t.A.w,z:t.A.z?t.A.z:0},bz=c.A.z[1];
      if(c._no.Z)text="Kannst du den Bruchteil direkt abziehen? "+fr(a.z,H)+" ist größer als "+fr(bz,H)+", das klappt. Du musst kein Ganzes zerlegen und tippst auf „Nicht nötig“.";
      else{text=(a.z?"Von "+fr(a.z,H)+" kannst du "+fr(bz,H)+" nicht abziehen, der erste Bruchteil ist zu klein.":"Die erste Zahl hat keinen Bruchteil, von dem du "+fr(bz,H)+" abziehen könntest.")+" Darum "+S("zerlegst")+" du ein Ganzes: Ein Ganzes ist "+fr(H,H)+". Aus "+a.w+" Ganzen werden "+(a.w-1)+" Ganze, und zum Zähler kommen "+H+" dazu: "+(a.z?a.z+" + "+H+" = "+(a.z+H):"es sind jetzt "+H)+". Also ist "+mixH(a.w,a.z,H)+" = "+mixH(a.w-1,a.z+H,H)+".";
        vis=strips([{f:[H,H],label:"1 = "+H+"/"+H}]);}
    }
    if(k==="A"){
      text=kind==="gz"?"Jetzt schreibst du die Ganzen und die Bruchteile getrennt auf: "+c.A.w[0]+" "+sym(t.op)+" "+c.A.w[1]+" für die Ganzen und "+fr(c.A.z[0]+" "+sym(t.op)+" "+c.A.z[1],H)+" für die Bruchteile.":"Die Brüche haben jetzt denselben Nenner. Du schreibst sie auf einen Bruchstrich: Oben "+(add?"addierst":"subtrahierst")+" du die Zähler, der Nenner "+H+" bleibt. Die Nenner "+(add?"addierst":"subtrahierst")+" du "+S("nicht")+"!";
      if(kind!=="gz"&&add)vis=strips([{f:[c.A.z[0]+c.A.z[1],H],label:c.A.z[0]+"/"+H+" + "+c.A.z[1]+"/"+H,split:c.A.z[0]}]);
      if(kind!=="gz"&&!add)vis=strips([{f:[c.A.z[0],H],label:c.A.z[0]+"/"+H},{f:[c.A.z[1],H],label:"− "+c.A.z[1]+"/"+H}]);
    }
    if(k==="B"){const [W,Z]=c.B;
      text=kind==="gz"?"Ganze: "+c.A.w[0]+" "+sym(t.op)+" "+c.A.w[1]+" = "+W+". Bruchteile: "+c.A.z[0]+" "+sym(t.op)+" "+c.A.z[1]+" = "+Z+", der Nenner "+H+" bleibt. Zusammen: "+(Z?mixH(W,Z,H):W)+".":"Zähler: "+c.A.z[0]+" "+sym(t.op)+" "+c.A.z[1]+" = "+Z+". Der Nenner bleibt "+H+". Das ergibt "+fr(Z,H)+".";
      if(c.zero)text+=" Es gibt keinen Bruchteil mehr, das Ergebnis ist die ganze Zahl "+W+". Kürzen und Umwandeln entfallen.";
    }
    if(k==="R"&&!c.zero){const [W,Z,Hh]=c.B,g=gcd(Z,Hh),Rr=c.R;
      if(g>1){text="Jetzt wird gekürzt. "+Z+" und "+Hh+" kann man beide durch "+g+" teilen, und "+g+" ist die größte Zahl, die das schafft. "+Z+" : "+g+" = "+Rr[1]+" und "+Hh+" : "+g+" = "+Rr[2]+"."+(kind==="gz"?" Die Ganzen bleiben gleich.":"")+(Rr[2]===1?" Im Nenner steht jetzt 1.":"");
        vis=strips([{f:[Z,Hh],label:Z+"/"+Hh},{f:[Rr[1],Rr[2]],label:Rr[1]+"/"+Rr[2]}]);}
      else text=Z+" und "+Hh+" haben keinen gemeinsamen Teiler außer 1, der Bruch lässt sich nicht kürzen. Du tippst auf „Kann nicht gekürzt werden“.";
    }
    if(k==="R"&&c.zero)text="Es gibt keinen Bruchteil, hier ist nichts zu kürzen.";
    if(k==="G"&&c.zero)text="Das Ergebnis ist schon eine ganze Zahl.";
    if(k==="G"&&!c.zero){const [W,p,q]=c.R;
      if(!c.G)text=kind==="gz"?"Der Bruchteil "+fr(p,q)+" ist kleiner als 1. Die gemischte Zahl ist fertig, du tippst auf „Kann nicht umgewandelt werden“.":"Der Zähler ist kleiner als der Nenner, das Ergebnis ist also kleiner als 1. Daraus kann man keine gemischte Zahl machen. Du tippst auf „Kann nicht umgewandelt werden“.";
      else if(q===1)text="Im Nenner steht 1. Ein Bruch mit dem Nenner 1 ist eine ganze Zahl: "+fr(p,1)+" = "+p+"."+(kind==="gz"?" Das kommt zu den "+W+" Ganzen dazu: "+W+" + "+p+" = "+c.G[0]+".":" So darf das Ergebnis nicht stehen bleiben: Du schreibst nur die "+p+" ins große Feld.");
      else if(kind==="gz"){const f=Math.floor(p/q),r=p%q;text="Der Bruchteil "+fr(p,q)+" ist größer als 1. Darin steckt "+(f===1?"ein Ganzes":f+" Ganze")+": "+fr(p,q)+" = "+mixH(f,r,q)+". Das kommt zu den "+W+" Ganzen dazu: "+W+" + "+f+" = "+c.G[0]+". Das Ergebnis ist "+mixH(c.G[0],r,q)+".";}
      else{const [Wg,r]=c.G;text=fr(p,q)+" ist ein unechter Bruch, denn der Zähler ist größer als der Nenner. "+q+" passt "+(Wg===1?"einmal":Wg+"-mal")+" in "+p+" ("+Wg+" · "+q+" = "+Wg*q+"), dann bleibt "+r+" übrig. Also ist "+fr(p,q)+" = "+mixH(Wg,r,q)+". Du darfst das Ergebnis aber auch als unechten Bruch stehen lassen, dafür gibt es den Knopf „Als unechten Bruch lassen“.";vis=strips([{f:[p,q],label:Wg+" "+r+"/"+q}])}
    }
    steps.push({text,vals:cp(vals),hl:k,vis});
  });
  steps.push({text:"Fertig! "+taskH(t)+" = "+resH(result(t)),vals:cp(vals),hl:null,vis:""});
  return steps;
}

return{setMax,gcd,lcm,red,plan,canonical,initCtx,check,claim,result,kindOf,gen,parseOwn,solution,STEPNAME,fr,opH,taskH,taskT,resH,sym,mixH,needH,val};
})();


</script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const KN={gl:"Gleichnamige Brüche",ug:"Ungleichnamige Brüche",gz:"Gemischte Zahlen"};
const KEYP="bpm";
const S={level:Math.min(3,Math.max(1,+store.get(KEYP+"-level",1)||1)),tab:"gl",task:null,kind:"gl",plan:[],cur:0,ctx:null,firstTry:true,wrongSaved:false,done:false,own:false,
  stats:Object.assign({gl:[0,0],ug:[0,0],gz:[0,0]},store.get("bpm-stats",{})),review:false,revIdx:0,sol:null,solStep:0,ownOp:"add"};

function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

function hint(type,html){if(S.level>=2){hideNote();return}note(type,html)}
function setColor(k){document.documentElement.style.setProperty("--tab","var(--"+k+")")}
const mixed=()=>S.kind==="gz";

/* ---------- Bausteine ---------- */
function staticFrac(z,n){const f=el("span","frac");f.appendChild(el("span","sn",z));f.appendChild(el("span","bar"));f.appendChild(el("span","sn",n));return f}

  if(z)return staticFrac(z,n);
  return el("span","sn",w);
}
const staticOp=o=>staticMix(o.w,o.z,o.n);
function inp(id,label,cls){const i=el("input","fin"+(cls?" "+cls:""));i.inputMode="numeric";i.autocomplete="off";i.maxLength=4;i.dataset.f=id;i.setAttribute("aria-label",label);i.spellcheck=false;return i}
function inFrac(id,name){const f=el("span","frac");f.appendChild(inp(id+".z",name+": Zähler"));f.appendChild(el("span","bar"));f.appendChild(inp(id+".n",name+": Nenner"));return f}
function inMix(id,name){const m=el("span","mixin");m.appendChild(inp(id+".w",name+": Ganze","w"));m.appendChild(inFrac(id,name));return m}
function exprFrac(tops,op,bot){const f=el("span","frac"),u=el("span","den");u.appendChild(tops[0]);u.appendChild(el("span","opx dot",op));u.appendChild(tops[1]);f.appendChild(u);f.appendChild(el("span","bar"));f.appendChild(bot);return f}
function fitWidth(i){i.style.setProperty("--len",Math.max(2,i.value.length))}
function tagText(step){return L.STEPNAME[step]}

function taskLine(t,withLabel){
  const d=el("div","line task");if(withLabel)d.appendChild(el("span","small","Aufgabe"));
  d.appendChild(staticOp(t.A));d.appendChild(el("span","opx",L.sym(t.op)));d.appendChild(staticOp(t.B));d.appendChild(el("span","opx","="));return d;
}
/* Zeile bauen: vals = Werte der Musterlösung (statisch), sonst Eingabefelder */
function buildLine(step,t,vals,ctx){
  const d=el("div","line"+(step==="H"?" hn":""));d.dataset.step=step;d.appendChild(el("span","eqs","="));
  const sy=L.sym(t.op),gz=L.kindOf(t)==="gz",tag=()=>d.appendChild(el("span","tagx",tagText(step)));
  const chip=txt=>{d.appendChild(el("span","claim",txt));tag();return d};
  if(vals){
    if(vals.zero&&(step==="R"||step==="G"))return chip("entfällt, kein Bruchteil");
    if(vals._no[step])return chip(step==="Z"?"nicht nötig":step==="R"?"kann nicht gekürzt werden":"kann nicht umgewandelt werden");
  }
  if(step==="H"){d.appendChild(el("span","hnlab","Hauptnenner:"));d.appendChild(vals?el("span","sn",vals.H):inp("H.h","Hauptnenner"));tag();return d}
  if(step==="E"){
    [t.A,t.B].forEach((o,i)=>{if(i)d.appendChild(el("span","opx",sy));const k=i?"B":"A";
      if(vals){const e=vals.E[k];d.appendChild(staticMix(o.w,e[0],e[1]));return}
      if(o.w&&o.z){const m=el("span","mixin");m.appendChild(el("span","sw",o.w));m.appendChild(inFrac("E."+k,(i?"zweiter":"erster")+" Bruch erweitert"));d.appendChild(m)}
      else if(o.z)d.appendChild(inFrac("E."+k,(i?"zweiter":"erster")+" Bruch erweitert"));
      else d.appendChild(el("span","sn",o.w));});
    tag();return d;
  }
  if(step==="Z"){
    const H=vals?vals.A.n:(ctx&&ctx.H),b=vals?{w:vals.A.w[1],z:vals.A.z[1],n:H}:ctx?ctx.X[1]:t.B;
    if(vals)d.appendChild(staticMix(vals.Z[0],vals.Z[1],vals.Z[2]));else d.appendChild(inMix("Z","erste Zahl zerlegt"));
    d.appendChild(el("span","opx",sy));const s=staticOp(b);s.classList.add("given");d.appendChild(s);tag();return d;
  }
  if(step==="A"){
    if(gz){
      if(vals){d.appendChild(el("span","sn",vals.A.w[0]));d.appendChild(el("span","opx",sy));d.appendChild(el("span","sn",vals.A.w[1]))}
      else{d.appendChild(inp("A.wa","Ganze der ersten Zahl"));d.appendChild(el("span","opx",sy));d.appendChild(inp("A.wb","Ganze der zweiten Zahl"))}
      d.appendChild(el("span","opx","+"));
    }
    if(vals)d.appendChild(exprFrac([el("span","sn",vals.A.z[0]),el("span","sn",vals.A.z[1])],sy,el("span","sn",vals.A.n)));
    else d.appendChild(exprFrac([inp("A.za","erster Zähler"),inp("A.zb","zweiter Zähler")],sy,inp("A.n","Nenner")));
    tag();return d;
  }
  if(step==="B"||step==="R"||step==="G"){
    if(vals){const v=vals[step];d.appendChild(v[1]==null?el("span","sn",v[0]):staticMix(v[0],v[1],v[2]));tag();return d}
    d.appendChild(step==="G"||gz?inMix(step,step==="G"?"Ergebnis":"Zwischenergebnis"):inFrac(step,"Bruch"));tag();return d;
  }
  tag();return d;
}

/* ---------- Aufgabe starten ---------- */
function renderStats(){$("#stats").innerHTML=Object.keys(KN).map(k=>'<span class="stat">'+KN[k]+": <b>"+S.stats[k][0]+"</b> gelöst"+(S.stats[k][0]?", "+S.stats[k][1]+" auf Anhieb":"")+"</span>").join("")}
function wrongList(){return store.get("bpm-wrong",[])}
function taskKey(t){return JSON.stringify({op:t.op,A:t.A,B:t.B})}
function renderBadge(){$("#revBadge").textContent=wrongList().length}

function newTask(t,own){
  S.own=!!own;
  if(S.review&&!t){const W=wrongList();if(!W.length){showEmptyReview();return}S.revIdx=S.revIdx%W.length;t=JSON.parse(JSON.stringify(W[S.revIdx]))}
  if(!t)t=L.gen(S.tab);
  S.task=t;S.kind=L.kindOf(t);S.firstTry=true;S.wrongSaved=false;
  if(S.review)setColor(S.kind);
  const ri=$("#revInfo");
  if(S.review)ri.textContent="Fehler-Aufgabe "+(S.revIdx+1)+" von "+wrongList().length+" · "+KN[S.kind];
  else if(S.own)ri.textContent="Eigene Aufgabe · "+KN[S.kind];
  else if(S.tab==="mix")ri.textContent="Alles · diesmal: "+KN[S.kind];
  else ri.textContent=KN[S.kind];
  ri.textContent="Level "+S.level+" · "+ri.textContent;
  ri.classList.remove("hidden");
  showTaskUI(true);closeSolution();start();
}
function start(){
  const t=S.task;S.plan=L.plan(t);S.cur=0;S.ctx=L.initCtx(t);S.done=false;
  $("#stamp").classList.add("hidden");homeBtns();$("#work").after($("#stepbox"));
  const box=$("#lines");box.innerHTML="";box.appendChild(taskLine(t,true));
  S.plan.forEach(s=>box.appendChild(buildLine(s,t,null,null)));
  activate(true);
}
function homeBtns(){const a=$("#stepbox .actions");["#checkBtn","#noBtn","#skipBtn"].forEach(q=>a.insertBefore($(q),$("#nextBtn")));document.querySelectorAll(".lineact").forEach(x=>x.remove());document.querySelectorAll(".line.hasok").forEach(x=>x.classList.remove("hasok"));$("#checkBtn").textContent="✓ Prüfen"}
function lineBtns(line){
  homeBtns();
  const ok=el("span","lineact");$("#checkBtn").textContent="OK";ok.appendChild($("#checkBtn"));line.appendChild(ok);line.classList.add("hasok");
  const nodes=["#noBtn","#skipBtn"].filter(q=>!$(q).classList.contains("hidden")).map(q=>$(q));
  let box=null;if(nodes.length){box=el("div","lineact below");box.append(...nodes);line.after(box)}
  const w=$("#work");
  if(w.scrollWidth>w.clientWidth+1){line.classList.remove("hasok");if(!box){box=el("div","lineact below");line.after(box)}box.appendChild($("#checkBtn"));ok.remove()}
}
function lineOf(step){return $('#lines .line[data-step="'+step+'"]')}
function placeBox(scroll){
  const box=$("#stepbox");if(!S.task){$("#work").after(box);return}
  const ref=S.done||S.level===3?lineOf(S.plan[S.plan.length-1]):lineOf(S.plan[S.cur]);if(!ref){$("#work").after(box);return}
  const la=ref.nextElementSibling&&ref.nextElementSibling.classList.contains("lineact")?ref.nextElementSibling:null;
  (ref._togs||la||ref).after(box);
  if(scroll)setTimeout(()=>{const r=box.getBoundingClientRect();if(r.bottom>window.innerHeight||r.top<0)box.scrollIntoView({block:r.height>window.innerHeight*.8?"start":"end",behavior:"smooth"})},30);
}
const NOTXT={Z:"✋ Nicht nötig",R:"🚫 Kann nicht gekürzt werden",G:"🚫 Kann nicht umgewandelt werden"};
function activate(first){
  if(S.level===3){activate3(first);return}
  homeBtns();
  $("#phases").classList.remove("hidden");
  S.plan.forEach((s,i)=>{const d=lineOf(s);d.classList.toggle("wait",i>S.cur);d.classList.toggle("now",i===S.cur&&!S.done);d.classList.toggle("done",i<S.cur);
    d.querySelectorAll("input").forEach(x=>x.disabled=i!==S.cur||S.done)});
  renderPhases();
  $("#checkBtn").classList.toggle("hidden",S.done);$("#nextBtn").classList.toggle("hidden",!S.done);
  if(S.done){["#skipBtn","#noBtn"].forEach(q=>$(q).classList.add("hidden"));placeBox(!first);return}
  const step=S.plan[S.cur];
  if(step==="Z"){const old=lineOf("Z"),nl=buildLine("Z",S.task,null,S.ctx);nl.className=old.className;old.replaceWith(nl)}
  const nb=$("#noBtn");nb.classList.toggle("hidden",!NOTXT[step]);nb.textContent=NOTXT[step]||"";
  $("#skipBtn").classList.toggle("hidden",!(step==="G"&&!mixed()));$("#skipBtn").textContent="Als unechten Bruch lassen";
  lineBtns(lineOf(step));placeBox(!first);
  if(first)hint("info","<p>"+instr(step)+"</p>");
  const f=lineOf(step).querySelector("input");if(f&&!first)f.focus({preventScroll:true});
  if(f&&first&&window.matchMedia("(pointer:fine)").matches)f.focus({preventScroll:true});
}
function renderPhases(){
  const names=S.plan.map(tagText).concat(["Geschafft"]),idx=S.done?S.plan.length:S.cur;
  $("#phases").innerHTML=names.map((l,i)=>'<li class="'+(i<idx?"done":i===idx?"now":"")+'">'+(i+1)+". "+l+(i<idx?" ✓":"")+"</li>").join("");
}
function instr(step){
  const t=S.task,add=t.op==="add";
  if(step==="H")return"Die Nenner sind verschieden. Such den <strong>Hauptnenner</strong>: die kleinste Zahl, die durch "+t.A.n+" und durch "+t.B.n+" teilbar ist.";
  if(step==="E")return"<strong>Erweitere</strong> die Brüche auf den Hauptnenner "+S.ctx.H+". Nimm dazu Zähler und Nenner mit derselben Zahl mal."+(mixed()?" Die Ganzen bleiben stehen.":"");
  if(step==="Z")return"Kannst du den zweiten Bruchteil vom ersten abziehen? Wenn der erste Bruchteil zu klein ist, <strong>zerlegst du ein Ganzes</strong>: Ein Ganzes weniger, dafür kommt ein ganzer Bruch "+L.fr(S.ctx.H,S.ctx.H)+" zum Zähler dazu. Wenn es auch so geht, tippe auf „Nicht nötig“.";
  if(step==="A")return mixed()?"Schreib die <strong>Ganzen</strong> und die <strong>Bruchteile</strong> getrennt auf: vorne die Ganzen, hinten die Zähler auf einem Bruchstrich. Der Nenner bleibt.":"Schreib alles auf einen Bruchstrich: oben die beiden Zähler mit „"+L.sym(t.op)+"“ dazwischen. Der Nenner bleibt, du "+(add?"addierst":"subtrahierst")+" ihn <strong>nicht</strong>.";
  if(step==="B")return mixed()?"Rechne die Ganzen und die Zähler aus. Der Nenner bleibt, wie er ist.":"Rechne den Zähler aus. Der Nenner bleibt, wie er ist.";
  if(step==="R")return"Kürze "+(mixed()?"den Bruchteil ":"")+"so weit wie möglich."+(mixed()?" Die Ganzen bleiben gleich.":"")+" Lässt sich nichts kürzen, tippe auf „Kann nicht gekürzt werden“.";
  if(step==="G"){const R=S.ctx.R;return(R&&R.n===1&&!S.ctx.Rint?"Im Nenner steht 1. So darf das Ergebnis nicht stehen bleiben: Schreib es als <strong>ganze Zahl</strong> ins große Feld. ":"")+(mixed()?"Ist der Bruchteil 1 oder größer? Dann steckt darin noch ein Ganzes, das zu den Ganzen dazukommt. Schreib das Ergebnis neu. Ist der Bruchteil kleiner als 1, tippe auf „Kann nicht umgewandelt werden“.":"Kannst du das Ergebnis als ganze oder gemischte Zahl schreiben? Dann trag sie ein. Geht das nicht, tippe auf „Kann nicht umgewandelt werden“. Ein unechter Bruch darf auch so stehen bleiben: Dann tippe auf „Als unechten Bruch lassen“.")}
  return"";
}

/* ---------- Eingabe ---------- */
$("#lines").addEventListener("input",e=>{const i=e.target;if(i.tagName!=="INPUT")return;const v=i.value.replace(/\D/g,"").slice(0,4);if(v!==i.value)i.value=v;i.classList.remove("ok","bad");fitWidth(i)});
$("#lines").addEventListener("keydown",e=>{const i=e.target;if(i.tagName!=="INPUT")return;if(e.key==="Enter"){e.preventDefault();check()}});
$("#lines").addEventListener("focusin",e=>{if(e.target.tagName==="INPUT")setTimeout(()=>{try{e.target.select()}catch(x){}},0)});
function collect(step){
  const g=id=>{const x=$('#lines input[data-f="'+id+'"]');if(!x)return undefined;if(x.value==="")return null;return parseInt(x.value,10)};
  if(step==="H")return{h:g("H.h")};
  if(step==="E")return{A:{z:g("E.A.z"),n:g("E.A.n")},B:{z:g("E.B.z"),n:g("E.B.n")}};
  if(step==="A")return{wa:g("A.wa"),wb:g("A.wb"),za:g("A.za"),zb:g("A.zb"),n:g("A.n")};
  return{w:g(step+".w"),z:g(step+".z"),n:g(step+".n")};
}

/* ---------- Level 3: alles auf einmal ---------- */
function togsFor(step){if(step==="Z")return[["no","nicht nötig"]];if(step==="R")return[["no","kann nicht gekürzt werden"]];
  if(step==="G")return mixed()?[["nomix","kann nicht umgewandelt werden"]]:[["nomix","kann nicht umgewandelt werden"],["keep","als unechten Bruch lassen"]];return null}
function addToggles(){
  S.plan.forEach(step=>{const d=lineOf(step),T=togsFor(step);if(!T||d._togs)return;
    const box=el("div","togs togrow");d._togs=box;T.forEach(([k,txt])=>{const b=el("button","tog",txt);b.type="button";b.dataset.k=k;b.setAttribute("aria-pressed","false");
      b.onclick=()=>{if(S.done)return;const on=b.getAttribute("aria-pressed")!=="true";box.querySelectorAll(".tog").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed",on?"true":"false");
        d.classList.toggle("togon",on);d.classList.remove("errline");d.querySelectorAll("input").forEach(x=>{x.disabled=on;if(on)x.value="";x.classList.remove("ok","bad")})};box.appendChild(b)});
    d.after(box)});
}
function activate3(first){
  homeBtns();
  if(first&&S.plan.includes("Z")){const old=lineOf("Z"),d=el("div","line");d.dataset.step="Z";d.appendChild(el("span","eqs","="));d.appendChild(inMix("Z","erste Zahl zerlegt"));d.appendChild(el("span","opx",L.sym(S.task.op)));d.appendChild(el("span","sn given","…"));d.appendChild(el("span","tagx",tagText("Z")));old.replaceWith(d)}
  addToggles();$("#phases").classList.add("hidden");
  S.plan.forEach(s=>{const d=lineOf(s);d.classList.remove("wait","now");d.classList.toggle("done",S.done);
    const tb=d._togs,on=!!(tb&&tb.querySelector('.tog[aria-pressed="true"]'));d.querySelectorAll("input").forEach(x=>x.disabled=S.done||on);if(tb)tb.querySelectorAll(".tog").forEach(x=>x.disabled=S.done)});
  $("#checkBtn").classList.toggle("hidden",S.done);$("#nextBtn").classList.toggle("hidden",!S.done);
  $("#skipBtn").classList.add("hidden");$("#noBtn").classList.add("hidden");$("#checkBtn").textContent="✓ Alles prüfen";
  placeBox(!first);
  if(S.done)return;
  if(first){hideNote();const f=$("#lines input");if(f&&window.matchMedia("(pointer:fine)").matches)f.focus({preventScroll:true})}
}
function checkAll(){
  if(S.done||!S.task)return;
  const t=S.task;let ctx=L.initCtx(t),last=null;
  const empty=d=>[...d.querySelectorAll("input")].every(x=>x.value==="");
  $("#lines").querySelectorAll("input").forEach(x=>x.classList.remove("ok","bad"));
  S.plan.forEach(s=>lineOf(s).classList.remove("errline"));
  for(const step of S.plan){
    const d=lineOf(step),tg=d._togs&&d._togs.querySelector('.tog[aria-pressed="true"]');let r;
    if(ctx.zero&&(step==="R"||step==="G")&&(empty(d)||tg))r=L.claim(step,t,ctx,"zero");
    else if(tg)r=L.claim(step,t,ctx,tg.dataset.k);
    else if(step==="G"&&ctx.Rint&&empty(d))r=L.claim("G",t,ctx,"nomix");
    else r=L.check(step,t,ctx,collect(step));
    d.querySelectorAll("input").forEach(x=>{const m=r.marks[x.dataset.f];if(m)x.classList.add(m);else if(r.ok&&x.value!=="")x.classList.add("ok")});
    if(!r.ok){
      if(!r.noPenalty)markWrong();d.classList.add("errline");
      note(r.noPenalty?"info":"bad","<p><strong>Noch nicht ganz.</strong> In der Zeile „"+tagText(step)+"“ stimmt etwas nicht:</p><ul><li>"+r.msgs.join("</li><li>")+"</li></ul><p>Die Zeilen darüber sind richtig. Verbessere und prüfe noch einmal.</p>");
      const b=d.querySelector("input.bad")||d.querySelector("input");if(b&&!b.disabled)b.focus({preventScroll:true});
      placeBox(true);return;
    }
    ctx=r.ctx;last=r;
  }
  S.ctx=ctx;S.cur=S.plan.length;finish(last);
}
/* ---------- Prüfen ---------- */
function check(){
  if(S.level===3){checkAll();return}
  if(S.done||!S.task)return;
  const step=S.plan[S.cur],line=lineOf(step),r=L.check(step,S.task,S.ctx,collect(step));
  line.querySelectorAll("input").forEach(x=>{x.classList.remove("ok","bad");const m=r.marks[x.dataset.f];if(m)x.classList.add(m)});
  if(!r.ok&&r.noPenalty){note("info","<p>"+r.msgs.join(" ")+"</p>");placeBox(true);return}
  if(!r.ok){
    markWrong();const n=line.querySelectorAll("input.bad").length;
    note("bad","<p><strong>Noch nicht ganz.</strong> "+(n===1?"Ein Feld ist":n>1?n+" Felder sind":"Etwas ist")+" rot markiert:</p><ul><li>"+r.msgs.join("</li><li>")+"</li></ul><p>Verbessere und prüfe noch einmal. Du kannst so oft probieren, wie du willst.</p>");
    const b=line.querySelector("input.bad");if(b)b.focus({preventScroll:true});placeBox(true);return;
  }
  advance(r,line);
}
function claimAct(kind){
  if(S.done||!S.task)return;const step=S.plan[S.cur],line=lineOf(step),r=L.claim(step,S.task,S.ctx,kind);
  line.querySelectorAll("input").forEach(x=>x.classList.remove("ok","bad"));
  if(!r.ok){markWrong();note("bad","<p><strong>Noch nicht ganz.</strong></p><ul><li>"+r.msgs.join("</li><li>")+"</li></ul><p>Versuch es noch einmal. Du kannst so oft probieren, wie du willst.</p>");placeBox(true);return}
  line.querySelectorAll("input").forEach(x=>x.value="");
  line.classList.add("claimed");line.insertBefore(el("span","claim",r.claimed+" ✓"),line.querySelector(".tagx"));
  advance(r,line);
}
function advance(r,line){
  S.ctx=r.ctx;
  S.cur++;
  if(S.cur>=S.plan.length){finish(r);return}
  const nx=S.plan[S.cur];
  if(S.ctx.zero&&(nx==="R"||nx==="G")){activate(false);claimAct("zero");return}
  if(nx==="G"&&S.ctx.Rint){activate(false);claimAct("nomix");return}
  activate(false);
  hint("good","<p><strong>Richtig!</strong> "+(r.info?r.info+" ":"")+"Weiter geht’s mit Schritt "+(S.cur+1)+": "+tagText(nx)+".</p><p style=\"margin-top:6px\">"+instr(nx)+"</p>");
}
function finish(r){
  S.done=true;activate(false);
  const k=S.kind,st=S.stats[k];st[0]++;if(S.firstTry)st[1]++;store.set("bpm-stats",S.stats);renderStats();
  let rev="";
  if(S.review){if(S.firstTry){store.set("bpm-wrong",wrongList().filter(x=>taskKey(x)!==taskKey(S.task)));rev=" Diesmal ohne Fehler, die Aufgabe fliegt aus dem Fehler-Training! ✂️"}
    else{S.revIdx++;rev=" Die Aufgabe bleibt im Fehler-Training, damit du sie noch einmal übst."}renderBadge()}
  const s=$("#stamp");s.textContent=pick(["Prima!","Super!","Klasse!","Spitze!","Toll!","Stark!"]);s.classList.remove("hidden");
  note("good","<p><strong>Alles richtig gerechnet!</strong> "+(r.info?r.info+" ":"")+L.taskH(S.task)+" = "+L.resH(L.result(S.task))+(S.firstTry?" Und das sogar auf Anhieb! 🌟":"")+rev+"</p>");
  $("#nextBtn").textContent=S.review?"Nächste Fehler-Aufgabe ▶":"Neue Aufgabe ▶";placeBox(true);$("#nextBtn").focus({preventScroll:true});
}

/* ---------- Fehler-Training ---------- */
function markWrong(){S.firstTry=false;if(S.wrongSaved||!S.task)return;S.wrongSaved=true;const W=wrongList(),key=taskKey(S.task);
  if(!W.some(x=>taskKey(x)===key)){W.push({op:S.task.op,A:S.task.A,B:S.task.B});store.set("bpm-wrong",W.slice(-60))}renderBadge()}
function showTaskUI(on){["#phases","#work","#solBtn","#resetBtn","#newBtn"].forEach(q=>$(q).classList.toggle("hidden",!on));$("#ownBtn").classList.toggle("hidden",S.review);
  if(!on)["#checkBtn","#skipBtn","#noBtn","#nextBtn"].forEach(q=>$(q).classList.add("hidden"))}
function showEmptyReview(){closeSolution();homeBtns();showTaskUI(false);S.task=null;$("#work").after($("#stepbox"));$("#revInfo").classList.add("hidden");$("#phases").innerHTML="";
  note("good","<p><strong>Keine Fehler-Aufgaben 🎉</strong></p><p style=\"margin-top:6px\">Jede Aufgabe, bei der du beim Prüfen einen Fehler machst, landet automatisch hier. Rechnest du sie im Fehler-Training ohne Fehler, verschwindet sie wieder.</p>")}

/* ---------- Musterlösung ---------- */
function openSolution(){if(!S.task)return;S.firstTry=false;S.sol=L.solution(S.task);S.solStep=0;$("#solution").classList.remove("hidden");renderSol();setTimeout(()=>$("#solution").scrollIntoView({behavior:"smooth",block:"start"}),30)}
function closeSolution(){$("#solution").classList.add("hidden")}
function renderSol(){
  const st=S.sol[S.solStep],box=$("#solLines"),c=L.canonical(S.task);box.innerHTML="";box.appendChild(taskLine(S.task,false));
  S.plan.forEach(s=>{if(!(s in st.vals))return;
    const v=Object.assign({},st.vals,{zero:c.zero});const d=buildLine(s,S.task,v,null);if(s===st.hl)d.classList.add("hl","new");box.appendChild(d)});
  $("#solText").innerHTML=st.text;
  const vv=$("#solVis");vv.innerHTML=st.vis||"";vv.classList.toggle("hidden",!st.vis);
  $("#solCount").textContent="Schritt "+(S.solStep+1)+" von "+S.sol.length;
  $("#solPrev").disabled=S.solStep===0;$("#solNext").disabled=S.solStep===S.sol.length-1;
}

/* ---------- Eigene Aufgabe ---------- */
function setOwnOp(op){S.ownOp=op;document.querySelectorAll(".opsel button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.op===op?"true":"false"))}
function openOwn(){["oAg","oAz","oAn","oBg","oBz","oBn"].forEach(i=>$("#"+i).value="");setOwnOp(S.ownOp);$("#ownErr").textContent="";$("#overlay").classList.remove("hidden");$(S.tab==="gz"?"#oAg":"#oAz").focus()}
function ownOk(){
  const g=p=>({g:$("#o"+p+"g").value,z:$("#o"+p+"z").value,n:$("#o"+p+"n").value});
  const r=L.parseOwn(g("A"),S.ownOp,g("B"));
  if(r.err){$("#ownErr").textContent=r.err;return}
  $("#overlay").classList.add("hidden");newTask(r.task,true);
}
document.querySelectorAll(".opsel button").forEach(b=>b.onclick=()=>setOwnOp(b.dataset.op));

/* ---------- Bedienung ---------- */
function setTab(k){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.kind===k?"true":"false"));
  S.tab=k;S.review=k==="rev";S.revIdx=0;setColor(k);
  $("#newBtn").textContent=S.review?"Nächste Fehler-Aufgabe":"Neue Aufgabe";
  newTask();
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>setTab(t.dataset.kind));
function setLevel(n,silent){S.level=n;store.set(KEYP+"-level",n);L.setMax(n===1?60:100);
  document.querySelectorAll("#levels button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.level===n?"true":"false"));if(!silent)newTask()}
document.querySelectorAll("#levels button").forEach(b=>b.onclick=()=>setLevel(+b.dataset.level));
$("#levels").classList.remove("hidden");setLevel(S.level,true);
$("#checkBtn").onclick=check;
$("#noBtn").onclick=()=>claimAct(S.plan[S.cur]==="G"?"nomix":"no");
$("#skipBtn").onclick=()=>claimAct("keep");
$("#nextBtn").onclick=()=>$("#newBtn").click();
$("#solBtn").onclick=openSolution;
$("#solPrev").onclick=()=>{if(S.solStep>0){S.solStep--;renderSol()}};
$("#solNext").onclick=()=>{if(S.solStep<S.sol.length-1){S.solStep++;renderSol()}};
$("#solClose").onclick=()=>{closeSolution();start();window.scrollTo({top:0,behavior:"smooth"})};
$("#resetBtn").onclick=()=>{closeSolution();start()};
$("#newBtn").onclick=()=>{if(S.review&&!S.done)S.revIdx++;newTask()};
$("#ownBtn").onclick=openOwn;
$("#ownCancel").onclick=()=>$("#overlay").classList.add("hidden");
$("#ownOk").onclick=ownOk;
$("#overlay").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT"){e.preventDefault();ownOk()}});
$("#overlay").addEventListener("input",e=>{const i=e.target;if(i.tagName==="INPUT")i.value=i.value.replace(/\D/g,"")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#overlay").classList.add("hidden")});
/* QR-Code */
const PAGE_URL=/^https?:$/.test(location.protocol)?location.origin+location.pathname:"https://mathe-materialien.github.io/Unterrichtsmaterialien/Mathematik%206/03%20Bruchheft%20-%20Br%C3%BCche%20addieren%20und%20subtrahieren.html";
function openQr(){
  const box=$("#qrBox");
  try{const q=qrcode(0,"M");q.addData(PAGE_URL);q.make();
    box.innerHTML=q.createSvgTag({cellSize:8,margin:2,scalable:true});
    const svg=box.querySelector("svg");
    svg.setAttribute("role","img");svg.setAttribute("aria-label","QR-Code zum Bruchheft");
  }catch(e){box.innerHTML="<p>Der QR-Code konnte nicht geladen werden. Bitte die Seite neu laden.</p>"}
  $("#qrUrl").textContent=PAGE_URL;$("#qrOverlay").classList.remove("hidden");$("#qrClose").focus();
}
const closeQr=()=>{$("#qrOverlay").classList.add("hidden");$("#qrBtn").focus()};
$("#qrBtn").addEventListener("click",openQr);
$("#qrClose").addEventListener("click",closeQr);
$("#qrOverlay").addEventListener("click",e=>{if(e.target.id==="qrOverlay")closeQr()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#qrOverlay").classList.contains("hidden"))closeQr()});

renderStats();renderBadge();setTab("gl");
})();

</script>
</body>
</html>
